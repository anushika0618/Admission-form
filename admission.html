<!DOCTYPE html>
<html>
<head>
    <title>University Admission Form</title>
</head>
<body>

<h1>University Admission Form</h1>
<hr>

<form>

<h3>Personal Information</h3>

<label>First Name:</label>
<input type="text" required>

<label>Last Name:</label>
<input type="text" required>
<br><br>

<label>Date of Birth:</label>
<input type="date" required>
<br><br>

<label>Gender:</label>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
<br><br>

<label>Nationality:</label>
<input type="text">
<br><br>

<label>Blood Group:</label>
<select>
    <option>A+</option>
    <option>A-</option>
    <option>B+</option>
    <option>B-</option>
    <option>AB+</option>
    <option>AB-</option>
    <option>O+</option>
    <option>O-</option>
</select>

<hr>

<h3>Contact Information</h3>

<label>Email:</label>
<input type="email">
<br><br>

<label>Mobile Number:</label>
<input type="tel">
<br><br>

<label>Address:</label><br>
<textarea rows="4" cols="50"></textarea>
<br><br>

<label>City:</label>
<input type="text">

<label>State:</label>
<input type="text">

<label>Pincode:</label>
<input type="number">

<hr>

<h3>Academic Details</h3>

<label>10th School Name:</label>
<input type="text">
<br><br>

<label>10th Percentage:</label>
<input type="number">
<br><br>

<label>12th School Name:</label>
<input type="text">
<br><br>

<label>12th Percentage:</label>
<input type="number">
<br><br>

<label>Year of Passing:</label>
<input type="number">
<br><br>

<hr>

<h3>Course Selection</h3>

<label>Department:</label>
<select>
    <option>Computer Science Engineering</option>
    <option>Electronics Engineering</option>
    <option>Mechanical Engineering</option>
    <option>Civil Engineering</option>
    <option>Artificial Intelligence</option>
</select>

<br><br>

<label>Preferred Hostel:</label>
<input type="radio" name="hostel"> Yes
<input type="radio" name="hostel"> No

<hr>

<h3>Parent/Guardian Information</h3>

<label>Father's Name:</label>
<input type="text">
<br><br>

<label>Mother's Name:</label>
<input type="text">
<br><br>

<label>Parent Contact Number:</label>
<input type="tel">
<br><br>

<label>Occupation:</label>
<input type="text">

<hr>

<h3>Document Upload</h3>

<label>Upload Photograph:</label>
<input type="file">
<br><br>

<label>Upload 10th Marksheet:</label>
<input type="file">
<br><br>

<label>Upload 12th Marksheet:</label>
<input type="file">

<hr>

<h3>Declaration</h3>

<input type="checkbox" required>
I declare that all the information provided by me is true and correct.

<br><br>

<input type="submit" value="Submit Application">
<input type="reset" value="Reset Form">

</form>

</body>
</html>
